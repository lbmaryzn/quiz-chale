<script>
const D={"main": {"Zeus": ["Filhos de Zeus tendem a ter um espírito de liderança, consequentemente não lhe agrada a ideia de receber ordens.", "Mesmo que eles não se ofereçam para o cargo, geralmente são a primeira opção pela escolha de um grupo em geral.", "As pessoas costumam seguir as ordens deles pois sabem que ele fará de tudo para atingir o objetivo, e que tomará as decisões certas.", "São pessoas bem ambiciosas. O desejo e a cobiça por algo grande, ou por ser alguém grande.", "Fazem tudo da melhor forma possível, ou seja, querem sempre mostrar exemplo e ser motivo de orgulho.", "Jamais aceitaria a ideia de ser conhecido por alguém meia boca. Vão fazer o possível e impossível (pelo menos tentar) para, literalmente, serem os melhores.", "São confiantes e seguros de si. Sabem o seu valor e não deixarão ninguém os rebaixar.", "Pessoas justas, que tentarão ao máximo não quebrar com suas promessas.", "Não é difícil de serem irritados.", "Explodem sempre quando a situação foge do seu controle. Tudo tem que estar ao seu grado, caso contrário ele já fecha a cara.", "O senso de humor pode não ser comum como o da maioria, mas isso não quer dizer que não tenham.", "São pessoas inteligentes, que não se deixam levar fácil por conversa furada.", "A lealdade é super importante. Não muda de lado nem nos piores momentos, mesmo sabendo que a coisa está feia.", "De algum modo, se sente bem com tempestades com raios.", "Apesar de não demonstrar muito, são pessoas carinhosas, e que gostam de uma atenção a mais.", "São bem perfeccionistas, e não gostam de nada desorganizado.", "Pessoas de emoções fortes, mas que sabem a hora de contá-las e não vê dificuldade.", "Não admitem as coisas com muita facilidade, então pode esperar sentado se quiser ouvir uma confissão de \"ok, você estava certo\".", "Amam sempre receber elogios, e eles atuam como um combustível (apesar de que vai continuar bem mesmo sem eles).", "Pessoas teimosas e firmes em suas ideias. Defenderá com unhas, dentes e argumentos super válidos, mesmo que por mais maluca seja a ideia."], "Poseidon": ["São extremamente leais as pessoas. Nunca abandonaria quando a situação está feia, ficaria e lutaria, dando a sua vida para ajudar.", "Suas promessas valem ouro, eles costumam se culpar bastante quando quebram uma, e querem de alguma forma compensar.", "As palavras algumas vezes podem acabar escapando, geralmente eles não conseguem conter o que pensam, acabando saindo por afrontoso.", "Muitas das suas ideias e principalmente os seus motivos não são compreendidos facilmente pelos outros, principalmente os mais velhos.", "Auto-suficiente o bastante para tentar fazer tudo sozinho, às vezes por querer mostrar serviço ou simplesmente por não querer incomodar alguém por ajuda.", "Aliás, querem sempre mostrar do que são capazes. (Mesmo que não sejam, acabam dando um jeito.)", "No fundo tem um bom coração, e o que mais prezam é pelo bem estar dos que ama.", "Detestam a traição, principalmente quando é consigo. Nunca mais vão olhar para a pessoa com os mesmos olhos.", "Dependendo do tempo para decidir a melhor coisa a se fazer, não é simplesmente \"ah, pensei bora lá\", e sim um \"CALMA AI, TÔ PENSANDO\".", "Odeiam ser apressados, isso só piora as coisas e os fazem ficar nervosos.", "Tendem a ter ideias loucas e arriscadas, mas que no final acaba dando certo.", "Sua ligação com a água é bem forte. Costuma se sentir bem em contato com a água, seja em piscina ou mar. É incrivelmente relaxante e traz paz.", "A vida das pessoas que ama é mais importante que a própria.", "São pessoas divertidas e acolhedoras, sempre será um ombro amigo para qualquer um.", "É fácil entender o sentimento das pessoas e, muitas vezes, acaba até se identificando.", "São MUITO apegados a família.", "Apegados a algumas coisas que lembram momentos felizes.", "Daria a vida para salvar as pessoas que ama.", "Não é muito difícil para eles fazerem amizades, justamente por entenderem todos os lados e se colocarem no lugar dos outros.", "Se começa algo, vão terminar de um jeito ou de outro. Talvez não fique como esperado, mas terminar é certeza."], "Demeter": ["São pessoas, não necessariamente tímidas, mas são caladas. Geralmente em seu próprio mundo e pensamentos.", "Prezam pela educação, e tratam assim até quem não merece tal tratamento.", "Normalmente pacientes, não vêem problema em esperar e sabem dar o devido tempo.", "A natureza acalma de uma forma incrível. Se sentem super relaxados e no melhor lugar do mundo.", "Geralmente pacíficos, se ninguém passar do limite e acabar provocando ao extremo.", "Quando explode em raiva, as pessoas ficam realmente assustadas, justamente por isso não acontecer muito.", "Costuma se interessar pela causa animal e ambiental.", "Sempre está pensando em um jeito de poluir menos e em ideias sustentáveis.", "Gostam de socializar com as pessoas que geralmente são ignoradas pelas demais.", "São bons ouvintes, e tentarão sempre ajudar com alguma solução pacífica.", "Adoram plantas e já sonharam ou sonham trabalhar com isso.", "Geralmente dão grandes palestras sobre a poluição humana no mundo e como isso está afetando o planeta.", "Sabem a hora certa de falar ou escutar.", "Conseguem manter as palavras ruins para si, pois por mais que a pessoa mereça, a educação vem primeiro.", "Tentam sorrir e parecerem bem mesmo quando quebrados por dentro.", "São corajosos e vão fazer o máximo para ajudar a quem ama.", "Gostam de ler, mais pelo fato de aprender coisas novas que podem ser úteis.", "Apesar de serem considerados tímidos e calados, não são idiotas. Sabem quando alguém está fazendo algo por interesse ou por mal.", "Gostam de acompanhar o crescimento das plantas que cuidam.", "Podem ser perigosos quando extremamente irritados."], "Ares": ["Costumam ser bastante impulsivos, e não ligam para as consequências dessa impulsividade.", "Não são de se importar com qualquer um, então não ligam se suas ações afetam as pessoas.", "Em hipótese alguma levam desaforo pra casa, na verdade é a pessoa que levaria um olho roxo.", "Tem um pavio EXTREMAMENTE curto, qualquer coisa é motivo para discussão e brigas.", "Odeiam receber ordens, não são daqueles que baixam o rabinho e simples assim.", "Primeiro, eles não são ajudantes de ninguém, eles são aliados. Eles não são menos do que o igual.", "Adoram brigas e às vezes até começam elas por motivos bobos, por simplesmente brigar.", "São brutos na maior parte do tempo, mas isso não quer dizer que não podem ser o contrário.", "Tem muita mais muita dificuldade de falar de seus sentimentos, então não os apresse.", "São bastante orgulhosos, e quando o orgulho é afetado, eles empacam que nem uma mula, nada é capaz de mudar a opinião.", "Seu ponto fraco são as pessoas que amam, eles são os únicos que podem conseguir fazer mudar o pensamento e ideias.", "Não tem medo de praticamente nada.", "Pelas pessoas que ama, é capaz de dar a própria vida.", "Alguns são bastante desconfiados e questionam tudo e todos.", "A solução é; violência. Alguém magoou os sentimentos de um amigo? Violência. Falaram dele pelas costas? Violência.", "Apreciam esportes violentos, como luta ou futebol americano.", "Querem que as pessoas obedeçam suas ordens, apesar de seu orgulho não ajudar muito em tomar as melhores decisões como líder.", "São egoístas com o que consideram seu, e não gostam de dividir.", "\"Como assim ele falou assim com você? Ele vai receber uma surra!\"", "Apesar da máscara de pessoa durona, no fundo tem medo de perder quem ama."], "Atena": ["Adoram leitura, é como um refúgio para si.", "Não precisam necessariamente ser bons na escola (porque vai dá dificuldade de cada pessoa), mas eles adoram aprender coisas novas.", "São pessoas criativas, que pensam em coisas novas e inovadoras.", "É fácil de pensar em um plano, e sabem agir sob pressão.", "Seus planos tendem a ser seguros, mas de vez em quando podem arriscar.", "São pessoas sonhadoras, que pensam muito no futuro.", "Recebem críticas construtivas muito bem (apesar de ficarem tristes por não terem acertado de primeira), sabe que com elas é possível melhorar mais e mais.", "São orgulhosos, mas conseguem deixar o orgulho de lado se for para o bem das pessoas que importa.", "Conseguem liderar com facilidade, e pelo caminho mais seguro.", "A lógica sempre está na frente.", "Vão sempre pensar em uma saída, mesmo que no improviso.", "Tentam se mostrar alguém confiável e responsável para os mais velhos.", "Entre amigos, são mais leves e soltos, o senso de humor pode ser diferente, mas isso não quer dizer que sejam pessoas mal humoradas.", "Sabem do seu potencial e não gostam quando ignoram.", "São aquelas pessoas que as mães adorariam que o filho tivesse como companhia, pois são responsáveis e conseguem manter os outros na linha.", "Não é fã de quebrar as regras, fazendo isso apenas se for MUITO necessário.", "Adoram saber das coisas e apresentar fatos, mas as pessoas tendem a achar \"metido\" por simplesmente querer falar do que sabe.", "Apreciam a sua própria companhia, não há problema em ficar sozinha com um livro em mãos.", "Aprendem rápido quando o assunto lhe interessa.", "Acredita que as regras são importantes, pois sem elas as pessoas não respeitariam nada e viraria uma bagunça."], "Apolo": ["Não tem problemas em fazer amizades, em todo lugar que vai é fácil se enturmar.", "Pessoas comunicativas, falantes e que gostam de companhia.", "São seguros de si e sabem que são bons.", "Geralmente simpáticos com todo mundo.", "Costumam ser aquele tipo de pessoa que ilumina o local, traz felicidade e risadas.", "Gostam de tocar instrumentos musicais.", "Pessoas calorosas que adoram contato físico, sempre abraçando as pessoas.", "Adoram brincadeiras e pegadinhas, de preferência que não sejam consigo, mas não costumam se irritar fácil com isso.", "Na maior parte do tempo estão sorrindo, mesmo que não estejam felizes por dentro.", "Adoram vôlei (não precisam necessariamente jogar, serem bons e tals, mas assistir ou achar o esporte legal também vale).", "Adoram desenhar. São bem ligados à arte em si.", "Tem uma autoestima considerada alta, mas é porque eles sabem de seu valor e se aceitam.", "Gostam de ouvir música e cantar, lhes faz se sentir bem (foque no sentimento da música, você não precisa cantar bem para se sentir bem cantando).", "São pessoas acolhedoras, que não julgam os outros pela aparência e nem se importam com estereótipos.", "Não tem vergonha de simplesmente chegar na pessoa que gosta, e não liga para opiniões alheias.", "Tem ou já tiveram uma paixão pela medicina (pode se encaixar em veterinária também).", "De repente estão cantando sem motivo, qualquer hora é hora de cantar e de alegria.", "Não são muito fãs de baixo astral, sempre tentam animar todo mundo com piadas estranhas e sem sentido.", "É aquela pessoa que você sempre pode contar, que vai estar lá para segurar sua mão quando você precisar.", "São geralmente mais da emoção que da razão, é mais fácil darem apoio emocional do que uma solução para enfrentar um problema."], "Hefesto": ["São pessoas de bom coração, apesar de não saberem como demonstrar isso.", "Pacíficos, a ideia de violência não é muito agradável, mas isso não duvide que eles usem dela caso necessário.", "Gostam de inventar coisas novas e gostariam de serem conhecidos por isso.", "Geralmente são pessoas reservadas, gostam da companhia das pessoas que realmente querem o seu bem.", "Acha mais fácil se concentrar quando só.", "São apaixonados por arquitetura ou robótica.", "Normalmente tendem desde a infância terem interesse em coisas mais complexas, como montar brinquedos, por exemplo.", "Não conseguem demonstrar seus sentimentos com muita facilidade.", "Se pudessem, escolheriam fazer todos os trabalhos sozinhos.", "É muito difícil para eles entender o próprio sentimento, imagina o dos outros.", "São boas companhias se você quiser apenas alguém para estar ao seu lado em silêncio, sem lhe julgar.", "Querem ser importantes e mostrar serviço, que são úteis.", "Odeiam a traição, consideram um dos piores defeitos que existe.", "Máquinas são sempre boas companhias.", "Não são boas com conselhos.", "É difícil ter inimigos, eles simplesmente não fazem nada ao ponto de serem odiados por alguém, são apenas quietos em seu canto.", "Odeiam o fato das pessoas excluírem os \"estranhos\" ou os \"desajeitados\".", "Suas amizades são sempre verdadeiras e confiáveis, que vai poder contar pela vida toda.", "São engraçados, mas só quem realmente os conhece sabe desse lado.", "As pessoas não costumam entender quando falam sobre robótica, e eles tem que traduzir e diminuir várias vezes, isso se as pessoas não desistirem de entender."], "Afrodite": ["São bonitos, mas isso porque eles se consideram, não pela opinião alheia. Eles inclusive tem em mente que todo mundo deveria se aceitar como é.", "Extremamente confiantes e seguros de si. Sua aura emana poder e confiança.", "Gostam de alegria e de bom astral.", "Atuam muito bem. Saber usar do charme para conseguir o que quer.", "Podem ter fama de maldosos, mas eles apenas são um pouco mais individualistas que os outros, mas isso não quer dizer que só pensem em si.", "São pessoas boas, que veem beleza e amor em tudo e todos.", "O amor é uma palavra muito forte para eles, eles realmente apreciam esse sentimento e vive ele ao máximo.", "A união que eles têm é incrível. Alguém quebrou o coração de uma amiga? Ah, pode ter certeza que todos eles irão se vingar.", "Apreciam a moda e gostam de se vestir bem (claro, com seus próprios gostos).", "Ser o centro das atenções é sempre legal, e eles adoram.", "São boas pessoas para levantar o astral de alguém. Vão passar o dia inteiro ajudando alguma pessoa a se sentir bem com quem é, tanto fisicamente quanto internamente. São as melhores pessoas para ajudar os outros a se aceitarem.", "Sabem que são poderosos e adoram isso.", "Por mais que não seja intencional, muitos acabam \"quebrando\" o coração das pessoas porque o amor acaba não sendo correspondido.", "Geralmente educados, isso até alguém os insultar.", "\"Por favorzinho, sabe que eu te amo né?\" Acaba sendo uma das frases mais usadas.", "As pessoas costumam reclamar da demora para se arrumar quando vão sair.", "Tudo para si é um máximo e super incrível, não se assuste se eles começarem a te elogiar por \"pouca coisa\".", "A opinião alheia não os afeta, pois se aceitam do jeito que são.", "Usam as palavras certas e jeitos que a pessoa não consegue dizer não para eles.", "Adoram falar sobre sentimentos uns com os outros e de dar conselhos amorosos."], "Hermes": ["Não é difícil para eles inventar uma desculpinha esfarrapada e simplesmente se safar das coisas.", "As pessoas tendem a acreditar porque por fora parecem o tipo de pessoa que nunca faria nada de errado.", "Usam sempre as palavras certas para determinadas situações, e tem uma lábia fantástica.", "Adoram contar piadas idiotas e fazer as pessoas rirem.", "Mesmo sem querer, sempre está atento às coisas e observando ao redor. 💅", "Não são ladrões (até porque isso dá cadeia né amores ), mas tendem a pegar coisas emprestadas sem pedir, por exemplo uma roupa de um irmão.", "Sabe quando você quebrou algo e colocou de novo no lugar para a próxima pessoa achar que quebrou? Isso resume muito os filhos de Hermes.", "Adoram fazer pegadinhas e brincadeiras.", "Pessoas muito acolhedoras e simpáticas, uma nova companhia nunca é demais.", "Quanto mais amigos melhor. Ama estar com pessoas. E mais gente significa mais pessoas como alvo de suas brincadeiras.", "É fácil ganhar discussões de escolha (por exemplo, escolher um filme), pois eles sabem usar argumentos incríveis quando querem algo.", "E quando não querem algo, acham defeitos para que a pessoa simplesmente desista da ideia.", "Amam viajar e conhecer novos lugares, se pudesse até trabalharia com isso.", "Consegue manter a \"aparência\" de alguém confiável e que nunca faria ou fez algo ruim.", "É bem fácil para eles convencer as pessoas.", "Sabe quando a situação está feia e é hora de meter o pé, fugir de fininho é com eles mesmo.", "Suas ideias para se safar não tem limites, se estão com problemas sua mente é muito rápida em uma solução.", "São geralmente bem falantes e não são muito fãs do silêncio, nem de estar sozinhos.", "Não veem problema na mentira se isso for para salvar sua própria pele.", "A palavra esperteza lhes define mais do que inteligência."], "Dionísio": ["Por fora podem parecer inofensivos, mas quem conhece de verdade sabe que é exatamente o contrário.", "Tendem a ser individualistas, ou só se importar com a família e amigos.", "Pessoas realmente festeiras, não perdem uma festa por nada e amam estar no meio da multidão.", "As pessoas costumam rotular eles como loucos por causa de sua personalidade excêntrica.", "São pessoas alegres e despreocupadas com a vida.", "Não são o melhor exemplo de organização, bom, nem de uma vida calma, nem de segurança… talvez não sejam um bom exemplo de nada.", "Eles gostam de viver a vida e o resto de se dane, realmente não ligam para as consequências.", "Amam a adrenalina e coisas que fazem sua pulsação acelerar.", "Gostam de correr perigos e não ligam se são tachados de arrogantes.", "Pessoas aventureiras, que não tem medo do que vier pela frente e aceitam qualquer desafio.", "As pessoas tendem a rótula-los como vagabundos, que não querem um futuro e querem apenas passar o dia em festas.", "Uva é a sua fruta favorita.", "São dramáticos e exagerados, sempre aumentando as coisas e tentando dar uma de vítima.", "Não costumam ligar para nada, não confie em nada importante para eles fazerem porque não dará certo.", "Não liga para a opinião dos outros.", "Nas festas são aquelas pessoas que curtem sem se preocupar com o dia seguinte.", "É raríssimo eles admitirem que se arrependem de algo (mesmo que a vontade seja voltar no tempo e dar um tapão na cara de si mesmo e falar para não fazer).", "São aquelas pessoas que vão ficar até a festa acabar.", "Não costumam temer no que suas ações podem ocasionar no futuro", "Sua opinião é a que importa e detesta que digam o contrário."], "Hades": ["São pessoas normalmente bem reclusas, que geralmente estão sozinhas em seu canto.", "As pessoas costumam os rotular como sombrios, mas não é bem assim, pelo menos não totalmente.", "Em geral são bem tímidos e é difícil de se abrir com as pessoas.", "É difícil fazer amizades, mas quando conseguem, podem saber que será um ótimo amigo e fará de tudo pela pessoa.", "As pessoas que não os conhecem direito costumam se afastar por medo.", "Inteligentes e não tem dificuldade de pensar friamente em um plano.", "Gostam de rock.", "No fundo, eles gostam de atenção e carinho, mas de forma alguma admitem isso.", "São pessoas gananciosas e não gostam de dividir o que lhe pertence.", "Não costumam temer a morte, e sabem que isso é um processo natural e encara com tamanha tranquilidade.", "ODEIAM falar sobre seus sentimentos. Não existe pessoa melhor para guardar do que ELES MESMOS.", "Não vão de jeito nenhum falar sobre paixão com as pessoas, é constrangedor.", "Podem ser bastante teimosos com suas ideias e pensamentos.", "Mesmo estando errados, odeiam admitir isso.", "Sempre tem pessoas que são o seu ponto fraco, e que defende com unhas e dentes, e por elas dá a vida.", "Suas roupas são na maioria na cor preta.", "Odeiam quando a atenção vem tudo para si de uma vez, costumam ficar bem nervosos com tamanha atenção.", "Em uma sala com muita gente, eles evitam o centro e preferem os cantos ou perto da parede.", "Gostam da sua própria companhia e não é difícil para eles ficarem sozinhos. E odeiam os olhares de pena, como se fosse extremamente triste alguém apreciando sua própria companhia.", "Não são muito de festas, e nem de locais com muitas pessoas."], "Íris": ["São pacíficos. Realmente não desejam o mal a ninguém.", "Só atacam por pura autodefesa, detestam a violência gratuita.", "Gentis e sempre tratam tudo e todos com educação, coisa que prezam bastante.", "Misericordiosos, mesmo que a pessoa mereça, raramente fará algo para prejudicar.", "Prezam MUITO pela liberdade.", "Odeiam ser proibidos de fazerem algo.", "Tem um coração bom, sempre tenta ver o lado bom das pessoas e tenta dar uma segunda chance.", "Você nunca deve dizer a eles o que eles tem que fazer ou como agir, eles odeiam isso.", "Se dão bem com todo mundo.", "É fácil de socializar, em todo lugar que vai consegue fazer amizades ou pelo menos manter uma conversa agradável.", "Odeiam que opinem em suas vidas.", "Às vezes dão discursos longos sobre a liberdade.", "São geralmente bem calmos e é difícil de realmente se estressarem.", "Entendem fácil o sentimento das pessoas e conseguem se colocar no lugar delas.", "São as melhores pessoas para alguém desabafar, vão primeiro ouvir tudo o que a pessoa tem a dizer para então aconselhar.", "Gostam de fazer as pessoas se sentirem bem.", "Tem uma aura de liberdade que costuma incentivar as outras pessoas.", "Prezam pela harmonia e que todos pelo menos se entendam.", "Geralmente são aquelas pessoas que fazem de tudo para que o grupo permaneça unido.", "Se pudesse pedir alguma coisa, pediriam a paz mundial."], "Hipnos": ["São geralmente pessoas tranquilas e calmas.", "Muito desligados e desatentos para o que tá acontecendo em volta.", "Pessoas extremamente sábias, seu passatempo favorito é ler para aprender.", "Não são as melhores pessoas para confiar em alguma coisa, ou esquecem ou ficam com preguiça de fazer.", "Conhecidos por dormir muito, e que sem despertador não vão acordar tão cedo.", "Estão longe de serem os mais responsáveis.", "São procrastinadores natos, costumam sempre deixar as coisas para última hora, isso quando fazem.", "Quem conhece sabe que são pessoas divertidas.", "Contam piadas estranhas e difíceis de entender, enquanto eles riem as pessoas ainda estão tentando entender.", "São preguiçosos e um pouco covardes.", "Gostam de interpretar os sonhos, sempre buscando significados para as coisas.", "A presença deles trás sonolência e calmaria.", "Geralmente estão no mundo da lua, com a cabeça pensando em outras coisas menos a realidade.", "Acreditam que todos os sonhos tem significados.", "Estão sempre sonolentos.", "As vezes são lerdos para entender e processar as informações.", "Os sonhos tendem a ser lúcidos e apresentarem algo real.", "Não negam ajuda para seus amigos.", "Sempre que podem estão dormindo ou cochilando.", "Gostam do silêncio e da calmaria."], "Nêmesis": ["São imparciais na maioria das coisas se fazem, vão pelo certo, nunca deixam de escolher algo só porque pode magoar um amigo.", "São leais as pessoas que ama, e jamais vai deixar-los na mão.", "Extremamente sinceros, então se você tem dificuldade de receber críticas é melhor não perguntar a eles.", "Fiéis, mesmo nós momentos mais difíceis.", "Honestos e prezam pela franqueza, nunca se deve mascarar as coisas.", "Seu senso de justiça é absurdo. Todos devem pegar pelo o que fazem e ninguém deve sair impune das coisas ruins.", "Extremamente vingativos, nunca vão esquecer do que fizeram para si ou família.", "Querem igualdade acima de tudo.", "Prezam pela franqueza, podendo até punir quem não cumpre a isso.", "Não acham que a sorte deveria existir, pois é injusto alguns terem mais que os outros.", "Se afastam sem pensar duas vezes de pessoas infiéis, nunca sequer conseguem ver uma justificativa para isso.", "Leais as suas próprias ideias e raramente vão mudar.", "A melhora nunca é de mais.", "Sempre estarão ao seu lado quando precisar.", "Com certeza não são aquele tipo de pessoa que só está ao seu lado em momentos bons.", "Podem ser fáceis de serem irritados, e acredite, ninguém quer eles irritados.", "Geralmente não são fãs de brincadeiras ou qualquer coisas fúteis do tipo.", "Tentam mostrar educação, principalmente aos mais velhos.", "Odeiam mentiras, a verdade é sempre melhor, mesmo que dura.", "Não costumam ligar se machucam os sentimentos dos outros, eles só são eles mesmos."], "Nice": ["Tudo é motivo de competição.", "Amam ganhar, e não existe essa de o que importa é participar.", "Costumam causar confusões por causa da sua aura competitiva, as outras pessoas acabam se afastando.", "Tem uma personalidade excêntrica e \"pirada\".", "As pessoas costumam rotular eles como loucos por causa de sua obsessão por ganhar.", "São pessoas bem animadas e que nunca estão quietos.", "Se afastam daqueles que podem atrapalhar suas faturas conquistas, mesmo que a pessoa seja importante para si.", "Amam esportes.", "Só ficam na presença de quem realmente gosta de sua companhia.", "São espertos e ambiciosos.", "Estão sempre em competições, ou para assistir ou participar.", "Gostam de ser juízas das partidas.", "São determinados e sempre vão cumprir seu objetivo.", "Quando perdem alguma coisa, melhor sair de perto. Vão ficar um tempão emburrados e bravos consigo mesmo.", "Não é todo mundo que consegue entender seus objetivos e planos.", "São focados e nada e nem ninguém irá mudar sua visão do que querem pra si.", "Prezam acima de tudo, amizades que lhes entendão de verdade.", "Geralmente isolados e focados em conseguir vencer seus objetivos.", "Quando tem a tão sonhada vitória é melhor os outros se prepararem, vão passar dias falando sobre."], "Hebe": ["São cheios de energia.", "Sempre querendo ajudar todo mundo.", "Adoram fazer novos amigos.", "Generosos e de bom coração, se eles tem de muito, vão dar para o próximo.", "São pessoas bastante receptivas. Tratam todo mundo bem.", "Geralmente nunca estão sozinhos, e sim na companhia de diversos amigos.", "Não gostam de ver os outros tristes, é sempre vai fazer de tudo até anima los.", "Não vê problema em mentir se for para agradar alguém, como por exemplo, falar que a roupa está bonita quando não está.", "Os melhores amigos que alguém pode ter, sempre vão estar ao lado para ajudar.", "As vezes são feitos de bobo fácil, por causa da \"inocência\".", "Podem acabar sendo usados pelos mais manipuladores, por causa da sua bondade excessiva.", "Alguns são desajeit tumam acordar com um humor de dormir com um outro.", "São extremamente vingativos.", "Conhecidos como sábios, que sabem das coisas pois vivenciaram.", "Orgulhosos, e seu orgulho é facilmente ferido.", "Eles odeiam serem rebaixados ou subestimados.", "São frios quando precisam, não tendo dificuldade de colocar a razão na frente da emoção.", "Podem ter a fama de \"malvados\" por causa dessa sua frieza.", "As pessoas em volta costumam dizer que eles tem um ar enigmático e misterioso.", "Não são muito fãs de falar sobre sentimentos, nem de se abrir com qualquer um.", "Mas, não tem dificuldade de se abrir com quem confia de verdade.", "São criativos, sempre tendo ideias diferenciadas.", "Nunca esquecem de quem os ajudou, e vão tentar retribuir.", "Também nunca se esquecem de quem negou ajuda, e tentarão buscar vingança.", "Gostam de magia, até procuram saber mais.", "São gentis com quem merece tal gentileza.", "Não costumam ter uma boa visão de disciplina, são bem difíceis de se controlar, os mais velhos que o digam.", "Na maior parte do tempo são introvertidos.", "Acreditam fielmente que tudo que vai, um dia volta.", "São a primeira alternativa para quem quer algum conselho."], "Éolo": ["Normalmente são frios com tudo e todos.", "Explodem muito facilmente quando a situação foge do controle.", "Mas, quando está tudo em ordem, costumam ser calmos, e essa calmaria chega até ser assustadora.", "A personalidade é forte, vivem todas as emoções com intensidade.", "São instáveis, então melhor não provocar muito.", "Considerados insensíveis.", "Geralmente calmos e centrados, nunca colocam a emoção na frente da razão.", "Pensam somente na sua família e amigos, raramente vão se preocupar com qualquer um.", "Tomam as melhores decisões justamente por pensar friamente.", "No geral, são pessoas boas que não desejam mal gratuito.", "Não cutuque a onça com vara curta, isso é o que mais define eles.", "Apenas um olhar deles pode assustar muita gente.", "É difícil relaxar muito com a companhia deles, pois o medo de que eles mudem drasticamente é grande.", "Gostam de que tudo esteja sobre seu controle.", "A ideia de receber ordens não lhe agrada muito, mas tudo bem, desde que a pessoa seja realmente uma boa líder.", "Costumam ser individualistas.", "Sempre há alguém que consegue os acalmar, e só escutam aquele alguém.", "Ser temido e melhor do que ser amado pelos outros.", "Seu senso de humor é um pouquinho mais fechado do que o normal, ou seja, é difícil faze-los rir ou achar algo engraçado.", "Faz de tudo para proteger as pessoas que ama."], "Perséfone": ["São pessoas dóceis, que não costumam usar da violência.", "Amigáveis, sempre querendo fazer amizades e tentando incluir todos.", "Podem ser muito mal humorados e chatos quando o clima também não está bom.", "No frio, costumam ser mais rabugentos.", "No calor, são as melhores pessoas possíveis.", "Geralmente simpáticos.", "Procuram não demonstrar falta de educação.", "É difícil falarem algum palavrão, e quando falam são aqueles que dá vontade de rir de tão bobos.", "Seu humor varia com o tempo.", "São atraídos pelo obscuro e enigmático.", "Se apegam fácil nas coisas.", "O calor é mil vezes melhor que o frio.", "Verão e primavera são as estações favoritas.", "Fazem as coisas no calor da emoção e se arrependem depois.", "São bem curiosos, não aguentam ficarem só na imaginação.", "Ajudam os outros, mesmo que por educação.", "Amam as plantas, principalmente as flores.", "Leias a quem ama.", "Tratam todos bem, por mais que não mereçam, pois não querem demonstrar falta de educação.", "Gostam de estampas floridas e de cores mais vivas."], "Melinoe": ["Mesmo que sejam sociáveis, estão constantemente sofrendo alterações de humor drásticas: enquanto em um momento estão se demonstrando ativos em uma discussão, no outro se tornam tímidos e menos participativos.", "Na maioria das vezes tão tímidos, e até sérios, mas não é sempre assim.", "Costuma se arrepender de falar algumas coisas, por isso prefere apenas o os", "Seu pecado com certeza seria a preguiça.", "Leitura é a segunda coisa que mais lhe agrada, só perdendo para dormir"], "Nêmesis": ["ODEIAM mentiras e nunca as perdoaria", "São MUITO leais e corajosos, então não vão abandonar nem nos piores momentos", "Não existe mentira necessária, toda mentira é ruim e só acarreta coisas ruins", "Podem parecer bem finos e educados quando querem", "Sua mente está sempre uma vez ou outra pensando em um plano de vingança"]}};

function home(){
 const n=Object.values(D.main).reduce((s,v)=>s+v.length,0);
 app.innerHTML=`<h1>Teste de Chalés ⚡🔱</h1><div class="card"><p>Descubra qual é o seu parente divino no universo de Percy Jackson. São <b>${n} afirmações</b> de <b>${D.order.length} deuses</b>, em ordem embaralhada.</p>
 <p class="mut">Para cada uma, escolha: 0 = nada a ver comigo · 1 = quase nada · 2 = parcialmente · 3 = totalmente. No fim você recebe a somatória por deus. Teste criado pela semideusa Any; não é oficial.</p>
 <div class="bar"><button class="pri" id="go">Começar</button></div></div>`;
 document.getElementById('go').onclick=()=>start('main');
}
function start(p){
 phase=p;i=0;
 if(p==='main'){qs=shuffle(D.order.flatMap(g=>D.main[g].map(t=>({g,t}))));base={};}
 else qs=shuffle(tied.filter(g=>D.tb[g]).flatMap(g=>D.tb[g].map(t=>({g,t}))));
 ans=new Array(qs.length).fill(null);show();
}
function show(){
 const q=qs[i];
 app.innerHTML=`<div class="pb"><i style="width:${i/qs.length*100}%"></i></div>
 <div class="mut">${phase==='main'?'Pergunta':'Desempate'} ${i+1} de ${qs.length}</div>
 <div class="card"><p class="q">${q.t}</p><div class="opts">${LBL.map((l,k)=>`<button data-v="${k}"><b>${k}</b>${l}</button>`).join('')}</div></div>
 <div class="nav"><button id="bk" ${i?'':'disabled'}>← Voltar</button><span class="mut">atalho: teclas 0–3</span></div>`;
 app.querySelectorAll('.opts button').forEach(b=>b.onclick=()=>pick(+b.dataset.v));
 document.getElementById('bk').onclick=()=>{if(i){i--;show()}};
}
function pick(v){ans[i]=v;if(i<qs.length-1){i++;show()}else finish()}
document.addEventListener('keydown',e=>{if(app.querySelector('.opts')&&'0123'.includes(e.key)&&e.key.length===1)pick(+e.key)});
function totals(){
 const t={};D.order.forEach(g=>t[g]=base[g]||0);
 if(phase==='main'){qs.forEach((q,k)=>t[q.g]+=ans[k]);}
 else qs.forEach((q,k)=>t[q.g]+=ans[k]);
 return t;
}
let prev={};
function finish(){
 if(phase==='tb'){const t=Object.assign({},prev);qs.forEach((q,k)=>t[q.g]+=ans[k]);render(t);return}
 const t=totals();base=t;render(t);
}
function render(t){
 const max=g=>3*(D.main[g].length+(phase==='tb'&&D.tb[g]?D.tb[g].length:0));
 const rank=D.order.slice().sort((a,b)=>t[b]-t[a]);
 const best=t[rank[0]];tied=rank.filter(g=>t[g]===best);
 const canTb=phase==='main'&&tied.length>1&&tied.some(g=>D.tb[g]);
 app.innerHTML=`<div class="card top"><div class="mut">Seu parente divino é</div>
 <h2>${tied.join(' / ')}</h2><div>${best} pontos${tied.length>1?' (empate)':''}</div>
 ${canTb?'<p class="mut">Houve empate! Dá para desempatar com as perguntas extras do teste original.</p><div class="bar" style="justify-content:center"><button class="pri" id="tb">Desempatar</button></div>':''}</div>
 <h3>Somatória por deus</h3><div class="card">${rank.map(g=>`<div class="row"><div class="rh"><span>${g}${UNOFF.has(g)?'<span class="tag">não oficial</span>':''}</span><b>${t[g]} / ${max(g)}</b></div><div class="rb"><i style="width:${t[g]/max(g)*100}%"></i></div></div>`).join('')}</div>
 <p class="mut">O teste não é oficial: pesquise mais a fundo a personalidade dos deuses e dos filhos deles.</p>
 <div class="bar"><button id="cp">Copiar resultado</button><button id="rs">Refazer</button></div>`;
 const tb=document.getElementById('tb');if(tb)tb.onclick=()=>startTb(Object.assign({},t));
 document.getElementById('rs').onclick=home;
 document.getElementById('cp').onclick=e=>{const s='Teste de Chalés:\n'+rank.map(g=>`${g}: ${t[g]}/${max(g)}`).join('\n');try{navigator.clipboard.writeText(s);e.target.textContent='Copiado!'}catch(x){e.target.textContent='Não foi possível copiar'}};
}
function startTb(keep){
 prev=keep;phase='tb';
 qs=shuffle(tied.filter(g=>D.tb[g]).flatMap(g=>D.tb[g].map(t=>({g,t}))));ans=new Array(qs.length).fill(null);i=0;show();
}
home();
</script></body></html>
